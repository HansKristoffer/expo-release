name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-title:
    name: PR title
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            let title = context.payload.pull_request?.title;
            if (!title) {
              const { data: prs } = await github.rest.pulls.list({
                ...context.repo, state: 'open',
                head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              });
              if (!prs.length) return;
              title = prs[0].title;
            }
            if (!/^(feat|fix|perf|docs|style|refactor|test|build|ci|chore|revert)(\([^\r\n]+\))?!?: \S[^\r\n]*$/.test(title)) {
              core.setFailed('Use a conventional PR title, for example fix: handle startup failures or feat!: change the public API.');
            }

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: bun run verify:package
