name: Expo Release
description: Fingerprint-driven EAS iOS OTA or native TestFlight build
author: Kristoffer Hansen

inputs:
  command:
    description: release (decide + operate), decide only, or operate only
    required: false
    default: release
  profile:
    description: EAS build profile (also used as the default update channel)
    required: false
    default: production
  operation:
    description: deploy, force-native, retry-ota, republish-latest, or rollback-embedded
    required: false
    default: deploy
  action:
    description: Decision action when command is operate (skip, ota, build, build-in-progress)
    required: false
    default: skip
  base:
    description: Git base SHA for the impact diff. Defaults to github.event.before or HEAD^.
    required: false
    default: ''
  head:
    description: Git head SHA for the impact diff. Defaults to GITHUB_SHA.
    required: false
    default: ''
  impact-paths:
    description: Comma-separated repo-root paths that count as an Expo change
    required: false
    default: apps/expo/
  environment:
    description: Optional EAS environment passed to eas update (e.g. production)
    required: false
    default: ''
  channel:
    description: EAS Update channel. Defaults to the profile name.
    required: false
    default: ''
  platform:
    description: Native platform
    required: false
    default: ios
  auto-submit:
    description: Pass --auto-submit on native builds
    required: false
    default: 'true'
  working-directory:
    description: Directory to run EAS commands from
    required: false
    default: apps/expo
  pre-update:
    description: Shell command to run before eas update (OTA path only)
    required: false
    default: ''
  post-update:
    description: Shell command to run after a successful eas update (OTA path only)
    required: false
    default: ''
  update-extra-args:
    description: Extra tokens appended to eas update (e.g. --input-dir dist --skip-bundler)
    required: false
    default: ''

outputs:
  action:
    description: Decision action (skip, ota, build, build-in-progress)
    value: ${{ steps.decision.outputs.action }}
  deploy_type:
    description: Stable PR-check type (none, ota, native)
    value: ${{ steps.decision.outputs.deploy_type }}
  fingerprint:
    description: Current EAS fingerprint hash
    value: ${{ steps.decision.outputs.fingerprint }}
  build_id:
    description: Matching EAS build id, if any
    value: ${{ steps.decision.outputs.build_id }}
  build_url:
    description: Matching EAS build URL, if any
    value: ${{ steps.decision.outputs.build_url }}
  result:
    description: Operate result (skipped, ota, native-build, recovery)
    value: ${{ steps.operate.outputs.result }}

runs:
  using: composite
  steps:
    - name: Decide release action
      id: decision
      if: >
        inputs.command == 'decide' ||
        (inputs.command == 'release' &&
          (github.event_name == 'push' ||
            inputs.operation == 'deploy' ||
            inputs.operation == 'retry-ota'))
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        IGNORE_EXPO_IMPACT: ${{ inputs.operation == 'retry-ota' && 'true' || 'false' }}
      run: |
        BASE="${{ inputs.base }}"
        if [[ -z "$BASE" ]]; then
          BASE="${{ github.event.before }}"
        fi
        if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
          BASE="$(git rev-parse HEAD^)"
        fi
        HEAD="${{ inputs.head }}"
        if [[ -z "$HEAD" ]]; then
          HEAD="$GITHUB_SHA"
        fi
        args=(
          decide
          --base "$BASE"
          --head "$HEAD"
          --profile "${{ inputs.profile }}"
          --platform "${{ inputs.platform }}"
          --impact-paths "${{ inputs.impact-paths }}"
        )
        if [[ "$IGNORE_EXPO_IMPACT" == "true" ]]; then
          args+=(--ignore-expo-impact true)
        fi
        bun "${{ github.action_path }}/src/cli.ts" "${args[@]}"

    - name: Operate release
      id: operate
      if: inputs.command == 'release' || inputs.command == 'operate'
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        ACTION: ${{ inputs.command == 'operate' && inputs.action || steps.decision.outputs.action || 'skip' }}
      run: |
        args=(
          operate
          --profile "${{ inputs.profile }}"
          --action "$ACTION"
          --operation "${{ inputs.operation }}"
          --platform "${{ inputs.platform }}"
          --auto-submit "${{ inputs.auto-submit }}"
        )
        CHANNEL="${{ inputs.channel }}"
        if [[ -n "$CHANNEL" ]]; then
          args+=(--channel "$CHANNEL")
        fi
        ENVIRONMENT="${{ inputs.environment }}"
        if [[ -n "$ENVIRONMENT" ]]; then
          args+=(--environment "$ENVIRONMENT")
        fi
        PRE_UPDATE="${{ inputs.pre-update }}"
        if [[ -n "$PRE_UPDATE" ]]; then
          args+=(--pre-update "$PRE_UPDATE")
        fi
        POST_UPDATE="${{ inputs.post-update }}"
        if [[ -n "$POST_UPDATE" ]]; then
          args+=(--post-update "$POST_UPDATE")
        fi
        UPDATE_EXTRA_ARGS="${{ inputs.update-extra-args }}"
        if [[ -n "$UPDATE_EXTRA_ARGS" ]]; then
          args+=(--update-extra-args "$UPDATE_EXTRA_ARGS")
        fi
        bun "${{ github.action_path }}/src/cli.ts" "${args[@]}"

    - name: Publish job summary
      if: always()
      shell: bash
      env:
        ACTION: ${{ steps.decision.outcome == 'success' && steps.decision.outputs.action || '' }}
        DEPLOY_TYPE: ${{ steps.decision.outputs.deploy_type }}
        RESULT: ${{ steps.operate.outputs.result || 'did not run' }}
        COMMAND: ${{ inputs.command }}
        OPERATION: ${{ inputs.operation }}
        PROFILE: ${{ inputs.profile }}
        FINGERPRINT: ${{ steps.decision.outputs.fingerprint }}
        MATCHING_BUILD: ${{ steps.decision.outputs.build_url || steps.decision.outputs.build_id }}
      run: |
        {
          echo "## ${PROFILE} iOS ${COMMAND}"
          echo ""
          echo "- Command: \`$COMMAND\`"
          echo "- Operation: \`$OPERATION\`"
          echo "- Result: \`$RESULT\`"
          if [[ -n "$ACTION" ]]; then
            echo "- Decision: \`$ACTION\`"
            echo "- Deploy type: \`${DEPLOY_TYPE:-none}\`"
            echo "- Fingerprint: \`${FINGERPRINT:-none}\`"
            echo "- Matching build: ${MATCHING_BUILD:-none}"
          fi
          if [[ "$COMMAND" == "release" ]]; then
            echo "- New native builds upload automatically to TestFlight when auto-submit is enabled."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
