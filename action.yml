name: Expo Release
description: Fingerprint-driven EAS OTA or native store build
author: Kristoffer Hansen

inputs:
  command:
    description: release (decide + operate), decide only, operate only, or doctor
    required: false
    default: release
  profile:
    description: EAS build profile. Its eas.json channel, environment and env are the defaults.
    required: false
    default: production
  operation:
    description: deploy, force-native, retry-ota, republish, or rollback-embedded
    required: false
    default: deploy
  deploy-type:
    description: Decision type when command is operate (none, ota, native)
    required: false
    default: none
  base:
    description: Git base SHA for the impact diff. Defaults to the merge base on a pull request, else github.event.before.
    required: false
    default: ''
  head:
    description: Git head SHA for the impact diff. Defaults to GITHUB_SHA.
    required: false
    default: ''
  impact-paths:
    description: Comma-separated repo-root paths that count as an Expo change
    required: false
    default: apps/expo/
  environment:
    description: EAS environment passed to eas update. Required for Expo SDK 55+, where it defaults to the eas.json profile environment.
    required: false
    default: ''
  channel:
    description: EAS Update channel. Defaults to the eas.json profile channel, else the profile name.
    required: false
    default: ''
  platform:
    description: Native platform (ios or android)
    required: false
    default: ios
  auto-submit:
    description: Pass --auto-submit on native builds
    required: false
    default: 'true'
  working-directory:
    description: Directory to run EAS commands from
    required: false
    default: apps/expo
  pre-update:
    description: Shell command to run before eas update (OTA path only)
    required: false
    default: ''
  post-update:
    description: Shell command to run after a successful eas update (OTA path only)
    required: false
    default: ''
  update-extra-args:
    description: Extra arguments appended to eas update, split like a shell (e.g. --input-dir dist --skip-bundler)
    required: false
    default: ''
  export-source-maps:
    description: On OTA, expo export with external source maps, then publish dist
    required: false
    default: 'false'
  group:
    description: Update group ID required by operation=republish
    required: false
    default: ''
  runtime-version:
    description: Runtime version for rollback-embedded. Defaults to the current fingerprint.
    required: false
    default: ''
  message:
    description: Override the generated eas update message
    required: false
    default: ''
  dry-run:
    description: Print mutating EAS commands without executing them
    required: false
    default: 'false'

outputs:
  deploy_type:
    description: Stable PR-check type (none, ota, native)
    value: ${{ steps.release.outputs.deploy_type }}
  changed:
    description: Whether the change needs a deploy (deploy_type is not none)
    value: ${{ steps.release.outputs.changed }}
  reason:
    description: Why decide chose deploy_type (no-impact-path, finished-build, build-in-progress, no-build-for-fingerprint)
    value: ${{ steps.release.outputs.reason }}
  changed_sources:
    description: For a native decision, the fingerprint sources changed since the profile's last finished build, one per line
    value: ${{ steps.release.outputs.changed_sources }}
  native_build_pending:
    description: Whether a matching native build is still in progress
    value: ${{ steps.release.outputs.native_build_pending }}
  fingerprint:
    description: Current EAS fingerprint hash
    value: ${{ steps.release.outputs.fingerprint }}
  build_id:
    description: Matching EAS build id, if any
    value: ${{ steps.release.outputs.build_id }}
  build_url:
    description: Matching EAS build URL, if any
    value: ${{ steps.release.outputs.build_url }}
  queued_build_id:
    description: The native build operate queued, if any
    value: ${{ steps.release.outputs.queued_build_id }}
  queued_build_url:
    description: Dashboard URL of the native build operate queued, if any
    value: ${{ steps.release.outputs.queued_build_url }}
  result:
    description: Operate result (skipped, ota, native-build, recovery), or failed
    value: ${{ steps.release.outputs.result }}
  failed_stage:
    description: The step that failed (fingerprint, build list, errored build, native build, ota export, ota update, pre-update, post-update, recovery, doctor)
    value: ${{ steps.release.outputs.failed_stage }}
  failure:
    description: On failure, the last lines the failed command printed and the next step
    value: ${{ steps.release.outputs.failure }}

runs:
  using: composite
  steps:
    # The CLI imports hanzio and zod; the action checkout has no node_modules.
    - name: Install expo-release dependencies
      working-directory: ${{ github.action_path }}
      shell: bash
      run: bun install --production --frozen-lockfile --omit peer

    - name: Expo release
      id: release
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXPO_RELEASE_COMMAND: ${{ inputs.command }}
        EXPO_RELEASE_PROFILE: ${{ inputs.profile }}
        EXPO_RELEASE_OPERATION: ${{ inputs.operation }}
        EXPO_RELEASE_DEPLOY_TYPE: ${{ inputs.deploy-type }}
        EXPO_RELEASE_BASE: ${{ inputs.base }}
        EXPO_RELEASE_HEAD: ${{ inputs.head }}
        EXPO_RELEASE_IMPACT_PATHS: ${{ inputs.impact-paths }}
        EXPO_RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        EXPO_RELEASE_CHANNEL: ${{ inputs.channel }}
        EXPO_RELEASE_PLATFORM: ${{ inputs.platform }}
        EXPO_RELEASE_AUTO_SUBMIT: ${{ inputs.auto-submit }}
        EXPO_RELEASE_PRE_UPDATE: ${{ inputs.pre-update }}
        EXPO_RELEASE_POST_UPDATE: ${{ inputs.post-update }}
        EXPO_RELEASE_UPDATE_EXTRA_ARGS: ${{ inputs.update-extra-args }}
        EXPO_RELEASE_EXPORT_SOURCE_MAPS: ${{ inputs.export-source-maps }}
        EXPO_RELEASE_GROUP: ${{ inputs.group }}
        EXPO_RELEASE_RUNTIME_VERSION: ${{ inputs.runtime-version }}
        EXPO_RELEASE_MESSAGE: ${{ inputs.message }}
        EXPO_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      # The action's own tsconfig: Bun would otherwise read the app's, and warn
      # about options it does not support (moduleSuffixes).
      run: bun --tsconfig-override "$ACTION_PATH/tsconfig.json" "$ACTION_PATH/src/cli.ts"

    - name: Publish job summary
      if: always()
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        OPERATION: ${{ inputs.operation }}
        PROFILE: ${{ inputs.profile }}
        PLATFORM: ${{ inputs.platform }}
        AUTO_SUBMIT: ${{ inputs.auto-submit }}
        DEPLOY_TYPE: ${{ steps.release.outputs.deploy_type }}
        REASON: ${{ steps.release.outputs.reason }}
        RESULT: ${{ steps.release.outputs.result || 'did not run' }}
        FAILED_STAGE: ${{ steps.release.outputs.failed_stage }}
        FAILURE: ${{ steps.release.outputs.failure }}
        FINGERPRINT: ${{ steps.release.outputs.fingerprint }}
        MATCHING_BUILD: ${{ steps.release.outputs.build_url || steps.release.outputs.build_id }}
        QUEUED_BUILD: ${{ steps.release.outputs.queued_build_url || steps.release.outputs.queued_build_id }}
        CHANGED_SOURCES: ${{ steps.release.outputs.changed_sources }}
        COMPARED_BUILD: ${{ steps.release.outputs.compared_build_url }}
        NATIVE_PENDING: ${{ steps.release.outputs.native_build_pending }}
      run: |
        {
          echo "## ${PROFILE} ${PLATFORM} ${COMMAND}"
          echo ""
          echo "- Command: \`$COMMAND\`"
          echo "- Operation: \`$OPERATION\`"
          if [[ -n "$FAILED_STAGE" ]]; then
            echo "- Result: \`$RESULT\` at \`$FAILED_STAGE\`"
          else
            echo "- Result: \`$RESULT\`"
          fi
          if [[ -n "$DEPLOY_TYPE" ]]; then
            echo "- Deploy type: \`$DEPLOY_TYPE\` (\`${REASON:-unknown}\`)"
            echo "- Native build pending: \`${NATIVE_PENDING:-false}\`"
            echo "- Fingerprint: \`${FINGERPRINT:-none}\`"
            echo "- Matching build: ${MATCHING_BUILD:-none}"
          fi
          if [[ -n "$QUEUED_BUILD" ]]; then
            echo "- Queued build: $QUEUED_BUILD"
          fi
          if [[ "$RESULT" == "native-build" && "$AUTO_SUBMIT" == "true" ]]; then
            echo "- The new build is submitted when it finishes (TestFlight on iOS, Play on Android)."
          fi
          if [[ -n "$CHANGED_SOURCES" ]]; then
            echo ""
            echo "Fingerprint sources changed since ${COMPARED_BUILD:-the last finished build}:"
            echo ""
            echo '```'
            echo "$CHANGED_SOURCES"
            echo '```'
          fi
          if [[ -n "$FAILURE" ]]; then
            echo ""
            echo '```'
            echo "$FAILURE"
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
